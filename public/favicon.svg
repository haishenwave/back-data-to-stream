<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="screen_grad" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#22D3EE"/> <stop offset="0.6" stop-color="#0EA5E9"/> <stop offset="1" stop-color="#1E40AF"/> </linearGradient>

        <filter id="outer_glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
            <feOffset in="blur" dx="0" dy="1" result="offsetBlur"/>
            <feFlood flood-color="#0EA5E9" flood-opacity="0.3" result="glowColor"/>
            <feComposite in="glowColor" in2="offsetBlur" operator="in" result="glowBlur"/>
            <feMerge>
                <feMergeNode in="glowBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#screen_grad)" filter="url(#outer_glow)"/>

    <rect x="3.5" y="3.5" width="57" height="57" rx="14.5" stroke="white" stroke-opacity="0.15" stroke-width="1"/>

    <text x="32" y="39"
          font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          font-weight="900"
          font-size="26"
          fill="white"
          text-anchor="middle"
          letter-spacing="1"
          style="text-shadow: 0px 2px 4px rgba(0,0,0,0.2);">LSH</text>
</svg>